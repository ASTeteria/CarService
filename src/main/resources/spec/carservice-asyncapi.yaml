asyncapi: 3.0.0
info:
  title: Car Service Event API
  version: 1.0.0
  description: |-
    The API allows to interact with car events

defaultContentType: application/json

servers:
  dev:
    host: localhost:9092
    protocol: kafka
    description: Development Kafka broker

channels:
  carDeletedEvents:
    address: car-deleted-events
    messages:
      CarDeleted:
        $ref: '#/components/messages/CarDeleted'
    description: The topic on which car deleted events may be produced and consumed.

operations:
  carDeleted:
    action: send
    tags:
      - name: Car
    channel:
      $ref: '#/channels/carDeletedEvents'
    summary: Produce car deleted event
    traits:
      - $ref: '#/components/operationTraits/kafka'
    messages:
      - $ref: '#/channels/carDeletedEvents/messages/CarDeleted'
components:
  messages:
    CarDeleted:
      name: CarDeleted
      title: Car deleted message
      summary: Contains data about car that was deleted
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/commonHeaders'
      payload:
        $ref: '#/components/schemas/CarDeletedPayload'
  schemas:
    CarDeletedPayload:
      type: object
      properties:
        carId:
          type: integer
          format: int64
          description: Car id
  messageTraits:
    commonHeaders:
      headers:
        type: object
        properties:
          dummy-header:
            type: integer
            minimum: 0
            maximum: 100
  operationTraits:
    kafka:
      bindings:
        kafka:
          clientId:
            type: string
            enum:
              - dummy-id